version: '3.8'

services:

  eureka-server:
    image: ${ECR_REGISTRY:-donatonback}/eureka-server:latest          # Para ECR
    build: ./eureka
    ports:
      - "8761:8761"
    networks:
      - backend-network

  ms-usuarios:
    image: ${ECR_REGISTRY:-donatonback}/ms-usuarios:latest
    build: ./api-usuarios
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    networks:
      - backend-network

  ms-donaciones:
    image: ${ECR_REGISTRY:-donatonback}/ms-donaciones:latest
    build: ./api-donaciones
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    networks:
      - backend-network

  ms-inventario:
    image: ${ECR_REGISTRY:-donatonback}/ms-inventario:latest
    build: ./api-inventario
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    networks:
      - backend-network

  ms-logistica:
    image: ${ECR_REGISTRY:-donatonback}/ms-logistica:latest
    build: ./api-logistica
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    networks:
      - backend-network

  ms-necesidades:
    image: ${ECR_REGISTRY:-donatonback}/ms-necesidades:latest
    build: ./api-necesidades
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
    networks:
      - backend-network

  api-gateway:
    image: ${ECR_REGISTRY:-donatonback}/api-gateway:latest
    build: ./gateway
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
