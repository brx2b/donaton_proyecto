server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  cloud:
    gateway:
      routes:
        - id: ruta-usuarios
          uri: ${USUARIOS_URI:lb://ms-usuarios}
          predicates:
            - Path=/usuarios,/usuarios/**
          filters:
            - StripPrefix=0

        - id: ruta-donaciones
          uri: ${DONACIONES_URI:lb://ms-donaciones}
          predicates:
            - Path=/donaciones,/donaciones/**
          filters:
            - StripPrefix=0

        - id: ruta-necesidades
          uri: ${NECESIDADES_URI:lb://ms-necesidades}
          predicates:
            - Path=/necesidades,/necesidades/**
          filters:
            - StripPrefix=0

        - id: ruta-inventario
          uri: ${INVENTARIO_URI:lb://ms-inventario}
          predicates:
            - Path=/inventario,/inventario/**
          filters:
            - StripPrefix=0

        - id: ruta-logistica
          uri: ${LOGISTICA_URI:lb://ms-logistica}
          predicates:
            - Path=/logistica,/logistica/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
