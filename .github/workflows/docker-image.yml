name: Deploy Backend Donaton

on:
  push:
    branches: ["main", "master"]
    paths:
      - "api-**/**"
      - "eureka/**"
      - "gateway/**"
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: api-donaciones
            repo: ms-donaciones
            port: "8082"
            instance_secret: "EC2_ID_DONACIONES"
          - folder: gateway
            repo: api-gateway
            port: "8086"
            instance_secret: "EC2_ID_GATEWAY"
          - folder: api-inventario
            repo: ms-inventario
            port: "8083"
            instance_secret: "EC2_ID_INVENTARIO"
          - folder: api-logistica
            repo: ms-logistica
            port: "8084"
            instance_secret: "EC2_ID_LOGISTICA"
          - folder: api-necesidades
            repo: ms-necesidades
            port: "8085"
            instance_secret: "EC2_ID_NECESIDADES"
          - folder: api-usuarios
            repo: ms-usuarios
            port: "8081"
            instance_secret: "EC2_ID_USUARIOS"
          - folder: eureka
            repo: eureka-server
            port: "8761"
            instance_secret: "EC2_ID_EUREKA"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "${{ matrix.folder }}/pom.xml"

      - name: Build JAR
        run: |
          echo "Compilando el proyecto en ${{ matrix.folder }}..."
          cd ${{ matrix.folder }}
          mvn clean package -DskipTests

      - name: config aws credenciales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: login ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/donatonback/${{ matrix.repo }}:latest"
          echo "Construyendo imagen para el repo: donatonback/${{ matrix.repo }}"
          cd ${{ matrix.folder }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Despliegue Individual vía AWS SSM
        run: |
          echo "Enviando comando de actualización a la instancia de ${{ matrix.repo }}..."
          aws ssm send-command \
            --instance-ids "${{ secrets[matrix.instance_secret] }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizando ${{ matrix.repo }} de forma independiente" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "IMAGE_URI=${{ secrets.ECR_REGISTRY }}/donatonback/${{ matrix.repo }}:latest",
              "sudo docker pull $IMAGE_URI",
              "sudo docker stop ${{ matrix.repo }} || true",
              "sudo docker rm ${{ matrix.repo }} || true",
              "sudo docker run -d --name ${{ matrix.repo }} --restart unless-stopped \
                -p ${{ matrix.port }}:${{ matrix.port }} \
                -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${{ secrets.EUREKA_PRIVATE_IP }}:8761/eureka/ \
                -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true \
                -e SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_PRIVATE_IP }} \
                $IMAGE_URI",
              "sudo docker image prune -f"
            ]}'
