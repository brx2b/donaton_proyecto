name: Deploy Backend Donaton

on:
  push:
    branches: ["main", "master"]
    paths:
      - "api-**/**"
      - "eureka/**"
      - "gateway/**"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: api-donaciones
            repo: ms-donaciones
          - folder: gateway
            repo: api-gateway
          - folder: api-inventario
            repo: ms-inventario
          - folder: api-logistica
            repo: ms-logistica
          - folder: api-necesidades
            repo: ms-necesidades
          - folder: api-usuarios
            repo: ms-usuarios
          - folder: eureka
            repo: eureka-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "${{ matrix.folder }}/pom.xml"

      - name: Build JAR
        run: |
          echo "🔨 Compilando el proyecto en ${{ matrix.folder }}..."
          cd ${{ matrix.folder }}
          mvn clean package -DskipTests

      - name: config aws credenciales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: login ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/donaton_proyecto/${{ matrix.repo }}:latest"
          echo "🚀 Construyendo imagen para el repo: donaton_proyecto/${{ matrix.repo }}"
          cd ${{ matrix.folder }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  trigger-ssm-deploy:
    needs: build-push-deploy
    runs-on: ubuntu-latest
    steps:
      - name: config aws credenciales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: despliegue
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizando backend en EC2 Privada" \
            --parameters '{"commands":[
              "set -e",
              "cd /home/ec2-user",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}/donaton_proyecto",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]}' \
            --output text
