name: Deploy Backend Donaton

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "api-**/**"
      - "eureka/**"
      - "gateway/**"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: api-donaciones
            repo: api-donaciones
          - folder: gateway
            repo: api-gateway
          - folder: api-inventario
            repo: api-inventario
          - folder: api-logistica
            repo: api-logistica
          - folder: api-necesidades
            repo: api-necesidades
          - folder: api-usuarios
            repo: api-usuarios
          - folder: eureka
            repo: eureka

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurar Java para compilar los microservicios
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Generar el archivo .jar (Crea la carpeta /target que Docker necesita)
      - name: Build JAR with Maven
        run: |
          echo "🔨 Compilando el proyecto en ${{ matrix.folder }}..."
          cd ${{ matrix.folder }}
          mvn clean package -DskipTests

      # 3. Configurar credenciales de AWS (Incluyendo el Session Token)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construir y subir la imagen ahora que el JAR existe
      - name: Build and Push
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/${{ matrix.repo }}:latest"
          echo "🚀 Construyendo imagen para el repo: ${{ matrix.repo }}"
          cd ${{ matrix.folder }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  trigger-ssm-deploy:
    needs: build-push-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Remote Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizando backend en EC2 Privada" \
            --parameters '{"commands":[
              "set -e",
              "cd /home/ec2-user",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker-compose pull",
              "docker-compose up -d",
              "docker image prune -f"
            ]}' \
            --output text
