name: CI/CD Backend - Microservicios Spring Boot

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "backend/**"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build y Push de todos los microservicios a ECR
        run: |
          cd backend
          
          echo " Construyendo y subiendo imágenes a ECR..."
          
          # Usamos las variables de entorno para que docker compose sepa dónde subir
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }} \
          docker compose build --no-cache
          
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }} \
          docker compose push

      - name: Desplegar en EC2 vía AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar Backend Microservicios desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "cd /home/ubuntu/backend || true",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker compose pull",
              "docker compose down",
              "docker compose up -d",
              "echo \"$(date) - Backend actualizado correctamente\" >> deploy.log"
            ]}' \
            --output text
