apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-donaciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-donaciones
  template:
    metadata:
      labels:
        app: ms-donaciones
    spec:
      containers:
        - name: ms-donaciones
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/donatonback/ms-donaciones:latest
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_APPLICATION_NAME
              value: "ms-donaciones"
            - name: EUREKA_URI
              value: "http://eureka-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-donaciones-service
spec:
  selector:
    app: ms-donaciones
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
