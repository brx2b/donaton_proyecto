apiVersion: apps/v1
kind: Deployment
metadata:
  name: donaton-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donaton-bff
  template:
    metadata:
      labels:
        app: donaton-bff
    spec:
      containers:
        - name: donaton-bff
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/donatonback/donaton-bff:latest
          ports:
            - containerPort: 4000
          env:
            - name: GATEWAY_URL
              value: "http://api-gateway-service:8086"
---
apiVersion: v1
kind: Service
metadata:
  name: donaton-bff-service
spec:
  selector:
    app: donaton-bff
  ports:
    - port: 4000
      targetPort: 4000
  type: LoadBalancer
