server:
  port: 8085

spring:
  application:
    name: ms-necesidades
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m  # El caché se destruye automáticamente cada 10 minutos
      cache-null-values: false
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
      #Ubica donde se aloja eureka para mostrar el servicio